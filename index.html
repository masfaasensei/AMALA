<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMALA - Personal Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-app: #F0FdfA;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --card-orange: linear-gradient(135deg, #FDBA74 0%, #FB923C 100%);
            --card-green: linear-gradient(135deg, #4ADE80 0%, #22C55E 100%);
            --card-teal: linear-gradient(135deg, #2DD4BF 0%, #0D9488 100%);
            --card-gold: linear-gradient(135deg, #FCD34D 0%, #D97706 100%);
            --card-purple: linear-gradient(135deg, #A78BFA 0%, #7C3AED 100%);
            --card-blue: linear-gradient(135deg, #60A5FA 0%, #2563EB 100%);
            --white: #ffffff;
            --shadow-soft: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            --radius-xl: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #eef2f5; display: flex; justify-content: center; min-height: 100vh; }

        .app-container {
            background-color: var(--bg-app);
            width: 100%; max-width: 480px;
            min-height: 100vh; position: relative;
            padding-bottom: 100px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        header { padding: 30px 24px 10px 24px; display: flex; justify-content: space-between; align-items: center; }
        .greeting h1 { font-size: 14px; color: var(--text-muted); font-weight: 400; }
        .greeting h2 { font-size: 20px; color: var(--text-main); font-weight: 600; }
        .avatar { width: 50px; height: 50px; background-color: var(--white); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: var(--shadow-soft); cursor: pointer; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px 24px; }
        .card { padding: 18px; border-radius: var(--radius-xl); color: white; position: relative; box-shadow: var(--shadow-soft); display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
        
        /* Layout Atas Tetap Kecil */
        .card.dhuha { background: var(--card-orange); height: 140px; }
        .card.sedekah { background: var(--card-gold); height: 140px; }

        /* Layout Amalan Quran & Tahajjud Memanjang (Full Width) */
        .card.full { grid-column: span 2; height: 100px; flex-direction: row; align-items: center; }
        
        .card.quran { background: var(--card-teal); }
        .card.hafalan { background: var(--card-purple); }
        .card.murojaah { background: var(--card-blue); }
        .card.tahajjud { background: var(--card-green); }

        .card-header { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; opacity: 0.9; }
        .card-value { font-size: 20px; font-weight: 600; margin-top: 2px; }
        
        /* Font khusus angka besar untuk dhuha/quran/tahajjud */
        .big-val { font-size: 30px; }

        .card-sub { font-size: 11px; opacity: 0.8; }

        .input-btn { width: 34px; height: 34px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 18px; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: var(--white); display: flex; justify-content: space-around; padding: 20px 10px; border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9CA3AF; text-decoration: none; }
        .nav-item.active { color: #0D9488; }
        .nav-item span { font-size: 10px; margin-top: 4px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="greeting">
                <h1 id="salam-waktu">Assalamu'alaikum,</h1>
                <h2 id="user-name">Memuat...</h2>
            </div>
            <div class="avatar" onclick="gantiNama()">👨🏻‍🏫</div>
        </header>

        <section class="dashboard-grid">
            <div class="card dhuha">
                <div class="card-header"><i class="ph ph-sun"></i> Dhuha</div>
                <div class="card-value big-val" id="val-dhuha">0</div>
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <span class="card-sub">Rakaat</span>
                    <button class="input-btn" onclick="isiData('dhuha')"><i class="ph ph-pencil-simple"></i></button>
                </div>
            </div>

            <div class="card sedekah">
                <div class="card-header"><i class="ph ph-heart"></i> Sedekah</div>
                <div class="card-value" id="val-sedekah">0</div>
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <span class="card-sub">Rupiah</span>
                    <button class="input-btn" onclick="isiData('sedekah')"><i class="ph ph-pencil-simple"></i></button>
                </div>
            </div>

            <div class="card quran full">
                <div style="flex:1">
                    <div class="card-header"><i class="ph ph-book-open"></i> Tilawah Al-Quran</div>
                    <div class="card-sub">Target: 1 Juz/hari</div>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="text-align: right;">
                        <div class="card-value big-val" id="val-quran">0</div>
                        <span class="card-sub">Halaman</span>
                    </div>
                    <button class="input-btn" onclick="isiData('quran')"><i class="ph ph-plus"></i></button>
                </div>
            </div>

            <div class="card hafalan full">
                <div style="flex:1">
                    <div class="card-header"><i class="ph ph-student"></i> Hafalan Baru</div>
                    <div class="card-value" id="val-hafalan">Belum ada</div>
                </div>
                <button class="input-btn" onclick="isiHafalan('hafalan')"><i class="ph ph-plus"></i></button>
            </div>

            <div class="card murojaah full">
                <div style="flex:1">
                    <div class="card-header"><i class="ph ph-arrows-counter-clockwise"></i> Murojaah</div>
                    <div class="card-value" id="val-murojaah">Belum ada</div>
                </div>
                <button class="input-btn" onclick="isiHafalan('murojaah')"><i class="ph ph-plus"></i></button>
            </div>

            <div class="card tahajjud full">
                <div style="flex:1">
                    <div class="card-header"><i class="ph ph-moon-stars"></i> Tahajjud</div>
                    <div class="card-sub">Shalat Lail</div>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="text-align: right;">
                        <div class="card-value big-val" id="val-tahajjud">0</div>
                        <span class="card-sub">Rakaat</span>
                    </div>
                    <button class="input-btn" onclick="isiData('tahajjud')"><i class="ph ph-pencil-simple"></i></button>
                </div>
            </div>
        </section>
        
        <nav class="bottom-nav">
            <a href="#" class="nav-item active"><i class="ph ph-house-line" style="font-size: 24px;"></i><span>Beranda</span></a>
            <a href="#" class="nav-item"><i class="ph ph-chart-bar" style="font-size: 24px;"></i><span>Laporan</span></a>
            <a href="#" class="nav-item"><i class="ph ph-calendar-blank" style="font-size: 24px;"></i><span>Puasa</span></a>
            <a href="#" class="nav-item"><i class="ph ph-gear" style="font-size: 24px;"></i><span>Akun</span></a>
        </nav>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('amala_db')) || {
            dhuha: 0, tahajjud: 0, quran: 0, sedekah: 0, 
            hafalan: "Belum ada", murojaah: "Belum ada", nama: ""
        };

        function initUser() {
            if (!db.nama) {
                let name = prompt("Ahlan wa Sahlan! Masukkan nama Anda:");
                db.nama = name || "Hamba Allah";
                save();
            }
            let jam = new Date().getHours();
            let salam = (jam < 11) ? "Selamat Pagi" : (jam < 15) ? "Selamat Siang" : (jam < 18) ? "Selamat Sore" : "Selamat Malam";
            document.getElementById('salam-waktu').innerText = salam + ",";
            document.getElementById('user-name').innerText = db.nama;
        }

        function isiData(tipe) {
            let n = prompt("Masukkan jumlah:");
            if (n) {
                db[tipe] = (tipe === 'sedekah') ? parseInt(n) : n;
                save();
            }
        }

        function isiHafalan(tipe) {
            let surat = prompt("Nama Surat:");
            let ayat = prompt("Ayat:");
            if (surat && ayat) {
                db[tipe] = surat + " (" + ayat + ")";
                save();
            }
        }

        function gantiNama() {
            let n = prompt("Ganti nama:", db.nama);
            if (n) { db.nama = n; save(); }
        }

        function save() {
            localStorage.setItem('amala_db', JSON.stringify(db));
            render();
        }

        function render() {
            document.getElementById('val-dhuha').innerText = db.dhuha;
            document.getElementById('val-tahajjud').innerText = db.tahajjud;
            document.getElementById('val-quran').innerText = db.quran;
            document.getElementById('val-sedekah').innerText = (db.sedekah || 0).toLocaleString('id-ID');
            document.getElementById('val-hafalan').innerText = db.hafalan;
            document.getElementById('val-murojaah').innerText = db.murojaah;
            document.getElementById('user-name').innerText = db.nama;
        }

        initUser(); render();
    </script>
</body>
</html>
