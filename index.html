<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMALA - Guru Fajar</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal-blue: #19748A;
            --mint-green: #A6F5C0;
            --dark-navy: #0A2E4A;
            --light-cyan: #B8FAFF;
            --pale-blue: #E7F2F7;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--pale-blue);
            margin: 0; padding-bottom: 110px;
            color: var(--dark-navy);
        }

        .container { max-width: 450px; margin: auto; padding: 20px; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h2 { font-family: 'Quicksand'; margin: 0; font-size: 1.2rem; }

        /* Grid Atas (Dhuha & Tahajjud) - Inspirasi Gambar 2 */
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { padding: 20px; border-radius: 28px; color: white; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .bg-dhuha { background: linear-gradient(135deg, #19748A, #248ea8); }
        .bg-tahajjud { background: linear-gradient(135deg, #0A2E4A, #19748A); }
        
        .card-label { font-family: 'Quicksand'; font-weight: 700; font-size: 0.9rem; }
        .card-val { display: block; font-size: 2rem; font-weight: 800; margin: 10px 0; }
        .edit-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 12px; border-radius: 10px; font-size: 0.7rem; cursor: pointer; }

        /* List Amalan - Inspirasi Gambar 3 */
        .list-container { background: white; border-radius: 30px; padding: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f0f0f0; }
        .item:last-child { border: none; }
        .icon { width: 45px; height: 45px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-right: 15px; }
        
        .info { flex: 1; }
        .info h4 { margin: 0; font-size: 0.9rem; font-weight: 700; }
        .info p { margin: 2px 0 0; font-size: 0.7rem; color: #7f8c8d; }

        /* Counter Box */
        .counter-box { text-align: right; min-width: 60px; }
        .counter-box b { font-size: 1rem; color: var(--teal-blue); }

        /* Checkbox Custom */
        .check-pill { width: 25px; height: 25px; border: 2px solid var(--mint-green); border-radius: 8px; cursor: pointer; }
        .check-pill.active { background: var(--mint-green); }

        /* Navigasi - Inspirasi Gambar 1 & 3 */
        .nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: var(--dark-navy); padding: 15px; border-radius: 25px; display: flex; justify-content: space-around; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .nav-link { color: rgba(255,255,255,0.4); text-decoration: none; font-size: 0.65rem; text-align: center; }
        .nav-link.active { color: var(--mint-green); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <p style="margin:0; font-size:0.8rem; opacity:0.6">Assalamu'alaikum,</p>
            <h2>Guru Fajar</h2>
        </div>
        <div style="background:var(--mint-green); padding:10px; border-radius:15px">👤</div>
    </div>

    <div class="main-grid">
        <div class="card bg-dhuha">
            <span class="card-label">Dhuha</span>
            <span class="card-val" id="dhuha-count">0</span>
            <button class="edit-btn" onclick="updateVal('dhuha')">Input Rakaat</button>
        </div>
        <div class="card bg-tahajjud">
            <span class="card-label">Tahajjud</span>
            <span class="card-val" id="tahajjud-count">0</span>
            <button class="edit-btn" onclick="updateVal('tahajjud')">Input Rakaat</button>
        </div>
    </div>

    <div class="list-container" style="margin-bottom: 20px;">
        <div class="item" onclick="updateVal('quran')">
            <div class="icon" style="background:var(--mint-green)">📖</div>
            <div class="info">
                <h4>Al-Qur'an</h4>
                <p>Target bacaan harian</p>
            </div>
            <div class="counter-box"><b id="quran-count">0</b> <small>Juz</small></div>
        </div>
        <div class="item" onclick="updateVal('sedekah')">
            <div class="icon" style="background:var(--light-cyan)">💰</div>
            <div class="info">
                <h4>Sedekah</h4>
                <p>Infaq harian rutin</p>
            </div>
            <div class="counter-box"><b id="sedekah-count">Rp 0</b></div>
        </div>
    </div>

    <h3 style="font-family:'Quicksand'; font-size:1rem; margin-bottom:15px">Dzikir Rutin</h3>
    <div class="list-container">
        <div class="item">
            <div class="icon" style="background:var(--pale-blue)">☀️</div>
            <div class="info"><h4>Dzikir Pagi</h4><p>Setelah shalat Subuh</p></div>
            <div class="check-pill" onclick="this.classList.toggle('active')"></div>
        </div>
        <div class="item">
            <div class="icon" style="background:var(--pale-blue)">🌑</div>
            <div class="info"><h4>Dzikir Petang</h4><p>Sebelum Maghrib</p></div>
            <div class="check-pill" onclick="this.classList.toggle('active')"></div>
        </div>
        <div class="item" style="background: var(--dark-navy); color: white; border-radius: 20px; margin: 5px;">
            <div class="icon" style="background:rgba(255,255,255,0.1)">🌙</div>
            <div class="info"><h4 style="color:white">Puasa</h4><p style="color:rgba(255,255,255,0.5)">Cek Kalender</p></div>
            <div style="font-size:1.2rem">📅</div>
        </div>
    </div>
</div>

<nav class="nav">
    <a href="#" class="nav-link active">🏠<br>Beranda</a>
    <a href="#" class="nav-link">📅<br>Aktivitas</a>
    <a href="#" class="nav-link">🌙<br>Puasa</a>
    <a href="#" class="nav-link">📊<br>Statistik</a>
</nav>

<script>
    function updateVal(type) {
        let val = prompt("Masukkan jumlah:");
        if (val !== null) {
            let display = val;
            if(type === 'sedekah') display = "Rp " + parseInt(val).toLocaleString();
            document.getElementById(type + '-count').innerText = display;
        }
    }
</script>

</body>
</html>
