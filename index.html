<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMALA - KHGT Integrated</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-app: #F0FdfA;
            --text-main: #1F2937;
            --card-orange: linear-gradient(135deg, #FDBA74 0%, #FB923C 100%);
            --card-green: linear-gradient(135deg, #4ADE80 0%, #22C55E 100%);
            --card-teal: linear-gradient(135deg, #2DD4BF 0%, #0D9488 100%);
            --card-gold: linear-gradient(135deg, #FCD34D 0%, #D97706 100%);
            --card-purple: linear-gradient(135deg, #A78BFA 0%, #7C3AED 100%);
            --card-blue: linear-gradient(135deg, #60A5FA 0%, #2563EB 100%);
            --card-rose: linear-gradient(135deg, #FB7185 0%, #E11D48 100%);
            --white: #ffffff;
            --shadow-soft: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            --radius-xl: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #eef2f5; display: flex; justify-content: center; min-height: 100vh; }

        .app-container { background-color: var(--bg-app); width: 100%; max-width: 480px; min-height: 100vh; position: relative; padding-bottom: 100px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }

        header { padding: 30px 24px 10px 24px; display: flex; justify-content: space-between; align-items: center; }
        .greeting h1 { font-size: 14px; color: #6B7280; }
        .greeting h2 { font-size: 20px; color: var(--text-main); font-weight: 600; }
        .avatar { width: 50px; height: 50px; background: white; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: var(--shadow-soft); cursor: pointer; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px 24px; }
        .card { padding: 18px; border-radius: var(--radius-xl); color: white; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-soft); cursor: pointer; }
        .card.full { grid-column: span 2; height: 100px; flex-direction: row; align-items: center; }
        .card.half { height: 140px; }

        .card.dhuha { background: var(--card-orange); }
        .card.sedekah { background: var(--card-gold); }
        .card.quran { background: var(--card-teal); }
        .card.hafalan { background: var(--card-purple); }
        .card.murojaah { background: var(--card-blue); }
        .card.tahajjud { background: var(--card-green); }
        .card.puasa { background: var(--card-rose); }

        .card-header { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; opacity: 0.9; }
        .card-value { font-size: 19px; font-weight: 600; }
        .big-val { font-size: 30px; }
        .card-sub { font-size: 11px; opacity: 0.8; }

        .input-btn { width: 34px; height: 34px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; border: none; color: white; }

        /* CALENDAR KHGT STYLING */
        .page { display: none; padding: 24px; }
        .page.active { display: block; }
        .calendar-container { background: white; border-radius: 20px; padding: 15px; box-shadow: var(--shadow-soft); }
        .calendar-header { text-align: center; margin-bottom: 15px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
        .day-name { font-size: 10px; font-weight: 600; color: #9CA3AF; }
        .date-cell { padding: 10px 5px; border-radius: 12px; font-size: 13px; cursor: pointer; position: relative; border: 1px solid #f3f4f6; }
        .date-cell.active-fast { background: #fee2e2; border-color: #fb7185; color: #e11d48; font-weight: 600; }
        .hijri-small { font-size: 8px; display: block; opacity: 0.7; }
        .bidh-mark { color: #D97706; font-weight: bold; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: var(--white); display: flex; justify-content: space-around; padding: 20px 10px; border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9CA3AF; cursor: pointer; }
        .nav-item.active { color: #0D9488; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="page-home" class="page active" style="padding:0">
            <header>
                <div class="greeting">
                    <h1>Assalamu'alaikum,</h1>
                    <h2 id="user-name">Memuat...</h2>
                </div>
                <div class="avatar" onclick="gantiNama()">👨🏻‍🏫</div>
            </header>

            <section class="dashboard-grid">
                <div class="card half dhuha">
                    <div class="card-header"><i class="ph ph-sun"></i> Dhuha</div>
                    <div class="card-value big-val" id="val-dhuha">0</div>
                    <div style="display: flex; justify-content: space-between; align-items: flex-end;"><span class="card-sub">Rakaat</span><button class="input-btn" onclick="isiData('dhuha', event)"><i class="ph ph-plus"></i></button></div>
                </div>

                <div class="card half sedekah">
                    <div class="card-header"><i class="ph ph-heart"></i> Sedekah</div>
                    <div class="card-value" id="val-sedekah">0</div>
                    <div style="display: flex; justify-content: space-between; align-items: flex-end;"><span class="card-sub">Rupiah</span><button class="input-btn" onclick="isiData('sedekah', event)"><i class="ph ph-plus"></i></button></div>
                </div>

                    <div style="flex:1"><div class="card-header"><i class="ph ph-book-open"></i> Tilawah Al-Quran</div><div class="card-sub">Target: 1 Juz/hari</div></div>
