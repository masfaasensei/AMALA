<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMALA - Personal Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-app: #F0FdfA;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --card-orange: linear-gradient(135deg, #FDBA74 0%, #FB923C 100%);
            --card-green: linear-gradient(135deg, #4ADE80 0%, #22C55E 100%);
            --card-teal: linear-gradient(135deg, #2DD4BF 0%, #0D9488 100%);
            --card-gold: linear-gradient(135deg, #FCD34D 0%, #D97706 100%);
            --white: #ffffff;
            --shadow-soft: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            --radius-xl: 24px;
            --radius-md: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #eef2f5; display: flex; justify-content: center; min-height: 100vh; }

        .app-container {
            background-color: var(--bg-app);
            width: 100%; max-width: 480px;
            min-height: 100vh; position: relative;
            padding-bottom: 100px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        header { padding: 30px 24px 10px 24px; display: flex; justify-content: space-between; align-items: center; }
        .greeting h1 { font-size: 14px; color: var(--text-muted); font-weight: 400; }
        .greeting h2 { font-size: 20px; color: var(--text-main); font-weight: 600; }
        .avatar { width: 50px; height: 50px; background-color: var(--white); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: var(--shadow-soft); }

        /* Dashboard Layout Baru */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px 24px; }
        .card { padding: 20px; border-radius: var(--radius-xl); color: white; position: relative; box-shadow: var(--shadow-soft); display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; overflow: hidden; }
        
        /* Tata Letak Baru Sesuai Instruksi Mas Fajar */
        .card.dhuha { grid-column: span 1; height: 140px; background: var(--card-orange); }
        .card.sedekah { grid-column: span 1; height: 140px; background: var(--card-gold); }
        .card.quran { grid-column: span 2; height: 110px; background: var(--card-teal); flex-direction: row; align-items: center; }
        .card.tahajjud { grid-column: span 2; height: 110px; background: var(--card-green); flex-direction: row; align-items: center; }

        .card-header { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; opacity: 0.9; }
        .card-value { font-size: 32px; font-weight: 600; }
        .card-sub { font-size: 12px; opacity: 0.8; }

        .input-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 18px; }

        /* Isi List Amalan */
        .section-title { padding: 0 24px; margin: 20px 0 12px; font-size: 16px; font-weight: 600; }
        .list-container { padding: 0 24px; display: flex; flex-direction: column; gap: 12px; }
        .list-item { background: var(--white); padding: 16px; border-radius: 18px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .list-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: var(--white); display: flex; justify-content: space-around; padding: 20px 10px; border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9CA3AF; text-decoration: none; }
        .nav-item.active { color: #0D9488; }
        .nav-item span { font-size: 10px; margin-top: 4px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="greeting">
                <h1>Assalamu'alaikum,</h1>
                <h2>Mas Fajar</h2>
            </div>
            <div class="avatar">👨🏻‍🏫</div>
        </header>

        <section class="dashboard-grid">
            <div class="card dhuha">
                <div class="card-header"><i class="ph ph-sun"></i> Dhuha</div>
                <div class="card-value" id="val-dhuha">0</div>
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <span class="card-sub">Rakaat</span>
                    <button class="input-btn" onclick="isiData('dhuha')"><i class="ph ph-pencil-simple"></i></button>
                </div>
            </div>

            <div class="card sedekah">
                <div class="card-header"><i class="ph ph-heart"></i> Sedekah</div>
                <div class="card-value" id="val-sedekah">Rp 0</div>
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <span class="card-sub">Al-Maun</span>
                    <button class="input-btn" onclick="isiData('sedekah')"><i class="ph ph-pencil-simple"></i></button>
                </div>
            </div>

            <div class="card quran">
                <div style="flex:1">
                    <div class="card-header"><i class="ph ph-book-open"></i> Al-Quran</div>
                    <div class="card-sub">Target: 1 Juz/hari</div>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="text-align: right;">
                        <div class="card-value" id="val-quran">0</div>
                        <span class="card-sub">Halaman</span>
                    </div>
                    <button class="input-btn" onclick="isiData('quran')"><i class="ph ph-plus"></i></button>
                </div>
            </div>

            <div class="card tahajjud">
                <div style="flex:1">
                    <div class="card-header"><i class="ph ph-moon-stars"></i> Tahajjud</div>
                    <div class="card-sub">Shalat Lail</div>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="text-align: right;">
                        <div class="card-value" id="val-tahajjud">0</div>
                        <span class="card-sub">Rakaat</span>
                    </div>
                    <button class="input-btn" onclick="isiData('tahajjud')"><i class="ph ph-pencil-simple"></i></button>
                </div>
            </div>
        </section>

        <div class="section-title">Dzikir Harian</div>
        <section class="list-container">
            <div class="list-item">
                <div class="list-icon" style="background: #3B82F6;"><i class="ph ph-sun-horizon"></i></div>
                <div style="flex:1; margin-left: 15px;">
                    <h4 style="font-size: 14px;">Dzikir Pagi</h4>
                    <p style="font-size: 11px; color: var(--text-muted);">Setelah Subuh</p>
                </div>
                <i class="ph ph-check-circle" style="font-size: 24px; color: #E5E7EB;"></i>
            </div>
        </section>
        
        <nav class="bottom-nav">
            <a href="#" class="nav-item active"><i class="ph ph-house-line" style="font-size: 24px;"></i><span>Beranda</span></a>
            <a href="#" class="nav-item"><i class="ph ph-chart-bar" style="font-size: 24px;"></i><span>Laporan</span></a>
            <a href="#" class="nav-item"><i class="ph ph-calendar-blank" style="font-size: 24px;"></i><span>Puasa</span></a>
            <a href="#" class="nav-item"><i class="ph ph-gear" style="font-size: 24px;"></i><span>Akun</span></a>
        </nav>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('amala_fajar')) || { dhuha: 0, tahajjud: 0, quran: 0, sedekah: 0 };

        function isiData(tipe) {
            let n = prompt("Masukkan jumlah:");
            if (n !== null && n !== "") {
                data[tipe] = (tipe === 'sedekah') ? parseInt(n) : n;
                localStorage.setItem('amala_fajar', JSON.stringify(data));
                tampilkan();
            }
        }

        function tampilkan() {
            document.getElementById('val-dhuha').innerText = data.dhuha;
            document.getElementById('val-tahajjud').innerText = data.tahajjud;
            document.getElementById('val-quran').innerText = data.quran;
            document.getElementById('val-sedekah').innerText = "Rp " + (data.sedekah || 0).toLocaleString('id-ID');
        }

        tampilkan();
    </script>
</body>
</html>
