<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMALA - FULL RUMAYSHO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root { --bg: #F0FDF4; --teal: #0D9488; --dark: #1E293B; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #eef2f5; display: flex; justify-content: center; }
        .app { background: var(--bg); width: 100%; max-width: 480px; min-height: 100vh; position: relative; padding-bottom: 100px; }
        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        header { padding: 15px 5px 25px; display: flex; justify-content: space-between; align-items: center; }
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { padding: 18px; border-radius: 24px; color: white; display: flex; flex-direction: column; justify-content: space-between; height: 120px; cursor: pointer; border: none; box-shadow: 0 8px 15px rgba(0,0,0,0.05); }
        .card.full { grid-column: span 2; height: 90px; flex-direction: row; align-items: center; }
        .card-val { font-size: 22px; font-weight: 600; }
        .nav-top { position: sticky; top: 0; background: white; padding: 15px; z-index: 100; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #eee; margin: -20px -20px 20px -20px; }
        .dzikir-item { background: white; padding: 20px; border-radius: 20px; margin-bottom: 15px; border: 2px solid transparent; }
        .dzikir-item.done { border-color: #4ADE80; background: #f0fff4; opacity: 0.6; }
        .arab { font-family: 'Amiri', serif; font-size: 24px; text-align: right; direction: rtl; line-height: 2.5; color: #1e293b; margin: 12px 0; }
        .info { font-size: 11px; color: var(--teal); font-weight: 700; text-transform: uppercase; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: white; display: flex; justify-content: space-around; padding: 18px; border-radius: 24px 24px 0 0; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
<div class="app">
    <div id="home" class="page active">
        <header>
            <div><h3>Assalamu'alaikum, <span id="user-name">Fajar</span></h3><p style="font-size: 12px; color: #64748b">Istiqomah adalah kunci.</p></div>
        </header>
        <div class="card-grid">
            <div class="card" style="background: #F97316" onclick="isiData('dhuha', 'Rakaat')"><span>Dhuha</span><span class="card-val" id="val-dhuha">0</span></div>
            <div class="card" style="background: #EAB308" onclick="isiData('sedekah', 'Rupiah')"><span>Sedekah</span><span class="card-val" id="val-sedekah">0</span></div>
            <div class="card full" style="background: #0D9488" onclick="isiData('quran', 'Halaman')"><span>Tilawah Quran</span><span class="card-val" id="val-quran">0</span></div>
            <div class="card" style="background: #EAB308; color: #422006" onclick="switchPage('pagi')"><span>Dzikir Pagi</span><i class="ph ph-sun"></i></div>
            <div class="card" style="background: #1E293B" onclick="switchPage('petang')"><span>Dzikir Petang</span><i class="ph ph-moon"></i></div>
            <div class="card" style="background: #16A34A" onclick="isiData('tahajjud', 'Rakaat')"><span>Tahajjud</span><span class="card-val" id="val-tahajjud">0</span></div>
        </div>
    </div>
