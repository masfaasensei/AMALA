<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMALA - Statistik Puasa KHGT</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #6B8E7B;
            --dark-green: #2D5A41;
            --bg-color: #F0F4F2;
            --card-bg: #E3EDE7;
            --text-main: #3D4E44;
            --text-sub: #7F8C8D;
            --border-color: #D1DED6;
            --accent-gold: #D4AC0D;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding-bottom: 120px;
            display: flex; justify-content: center;
        }

        .app-container { width: 100%; max-width: 450px; padding: 20px; }

        header { text-align: center; margin-bottom: 25px; }
        h1 { font-family: 'Quicksand', sans-serif; color: var(--primary-green); margin: 0; letter-spacing: 2px; }

        .overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center; z-index:1000;
        }
        .modal {
            background: var(--bg-color); padding: 20px; border-radius: 30px;
            width: 90%; max-width: 400px; text-align: center;
            max-height: 90vh; overflow-y: auto;
        }

        /* Kalender */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 15px 0; }
        .cal-day { 
            font-size: 0.8rem; padding: 10px 0; border-radius: 12px; 
            background: #fff; cursor: pointer; transition: 0.2s; position: relative;
        }
        .is-sun-mon { background: #e8f5e9; color: #2e7d32; font-weight: bold; }
        .is-ayyamul { border: 1px solid var(--accent-gold); color: var(--accent-gold); font-weight: bold; }
        .has-fasted { background: var(--dark-green) !important; color: white !important; transform: scale(1.05); }

        /* Statistik Box */
        .stats-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            margin-top: 20px; padding: 15px; background: #fff; border-radius: 20px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05);
        }
        .stat-item { text-align: center; }
        .stat-value { display: block; font-size: 1.2rem; font-weight: 700; color: var(--primary-green); }
        .stat-label { font-size: 0.6rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }

        .btn-done { margin-top: 20px; width: 100%; padding: 12px; border-radius: 15px; border: none; background: var(--primary-green); color: white; font-weight: bold; cursor: pointer; }
        .task-item { background: var(--card-bg); padding: 16px; border-radius: 20px; display: flex; align-items: center; margin-bottom: 10px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>AMALA</h1>
        <div style="font-size: 0.8rem; opacity: 0.7;">Muhasabah & Tracker</div>
    </header>

    <div id="main-content">
        <div class="task-item" onclick="openPuasa()">
            <div style="width:20px; height:20px; border:2px solid var(--primary-green); border-radius:6px; background: var(--card-bg);"></div>
            <span style="flex:1; margin-left:15px; font-weight: 600;">Puasa Sunnah & Kalender</span>
            <span style="font-size: 0.7rem; color: var(--primary-green);">Buka Kalender ❯</span>
        </div>
    </div>
</div>

<div id="modal-puasa" class="overlay">
    <div class="modal">
        <h3 style="font-family: Quicksand; margin: 0;">Jejak Puasa KHGT</h3>
        <p style="font-size: 0.7rem; color: var(--text-sub); margin-bottom: 5px;">Rajab 1447 H</p>
        
        <div class="calendar-grid" id="calendar-body"></div>

        <div class="stats-container">
            <div class="stat-item">
                <span class="stat-value" id="stat-month">0</span>
                <span class="stat-label">Bulan Ini</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="stat-year">0</span>
                <span class="stat-label">Tahun Ini</span>
            </div>
            <div class="stat-item">
                <span class="stat-value">140</span>
                <span class="stat-label">Target/Thn</span>
            </div>
        </div>

        <button class="btn-done" onclick="closePuasa()">Tutup & Simpan</button>
    </div>
</div>

<script>
    // Data Jejak Puasa (LocalStorage)
    // Struktur data: array berisi ID unik (misal: "2026-01-13")
    let fastingData = JSON.parse(localStorage.getItem('amala-fasting-v1')) || [];

    function openPuasa() {
        document.getElementById('modal-puasa').style.display = 'flex';
        renderCalendar();
    }

    function closePuasa() {
        document.getElementById('modal-puasa').style.display = 'none';
    }

    function renderCalendar() {
        const body = document.getElementById('calendar-body');
        body.innerHTML = '';
        const headers = ['Mi', 'Sn', 'Sl', 'Ra', 'Ka', 'Ju', 'Sa'];
        headers.forEach(h => body.innerHTML += `<div style="font-size:0.7rem; font-weight:bold; color:var(--text-sub)">${h}</div>`);

        // Simulasi Kalender 30 Hari
        for (let i = 1; i <= 30; i++) {
            let dayOfWeek = i % 7;
            let dateKey = `1447-07-${i}`; // ID unik untuk tanggal ini
            let classes = ['cal-day'];
            
            if (dayOfWeek === 2 || dayOfWeek === 5) classes.push('is-sun-mon');
            if (i === 13 || i === 14 || i === 15) classes.push('is-ayyamul');
            if (fastingData.includes(dateKey)) classes.push('has-fasted');

            body.innerHTML += `<div class="${classes.join(' ')}" onclick="toggleFasting('${dateKey}')">${i}</div>`;
        }
        updateStats();
    }

    function toggleFasting(dateKey) {
        const index = fastingData.indexOf(dateKey);
        if (index > -1) {
            fastingData.splice(index, 1);
        } else {
            fastingData.push(dateKey);
        }
        localStorage.setItem('amala-fasting-v1', JSON.stringify(fastingData));
        renderCalendar();
    }

    function updateStats() {
        // Hitung Bulan Ini (Filter ID yang mengandung bulan Rajab '07')
        const monthCount = fastingData.filter(d => d.includes('-07-')).length;
        // Hitung Tahun Ini (Semua data di tahun 1447)
        const yearCount = fastingData.length;

        document.getElementById('stat-month').innerText = monthCount;
        document.getElementById('stat-year').innerText = yearCount;
    }
</script>

</body>
</html>
