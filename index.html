<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMALA - Tumbuh Lebih Baik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button id="theme-toggle" onclick="toggleDarkMode()">🌙</button>
            <h1>AMALA</h1>
            <p class="tagline">Tumbuh lebih baik setiap hari</p>
        </header>

        <section class="quote-section">
            <div class="quote-card">
                <p id="daily-quote">"Niatkan setiap langkah kecilmu karena-Nya."</p>
                <span id="quote-source">— Amala</span>
            </div>
        </section>

        <div class="dashboard-grid">
            <section class="progress-section">
                <div class="progress-info">
                    <span>Progress</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </section>
            
            <section class="garden-section">
                <div id="plant-container">🌱</div>
                <p id="garden-status">Siap beramal?</p>
            </section>
        </div>

        <section class="stats-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-value" id="total-days">0</span>
                    <span class="stat-label">Hari Aktif</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="total-points">0</span>
                    <span class="stat-label">⭐ Bintang</span>
                </div>
            </div>
            <div id="history-list"></div>
        </section>

        <section class="task-section">
            <h3>Checklist Kebaikan</h3>
            <div class="add-task-container">
                <input type="text" id="new-task-input" placeholder="Tulis niat baikmu...">
                <button onclick="addTask()">Tambah</button>
            </div>
            <div id="task-list"></div>
            <button id="reset-btn" onclick="resetDay()">Selesaikan Hari Ini & Simpan Rekap</button>
        </section>
    </div>

    <audio id="sound-success" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <script src="script.js"></script>
</body>
</html>
